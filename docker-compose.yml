# Lance l'interface (8501) et l'API (8000) :  docker compose up --build
services:
  app:
    build: .
    image: rag-ecc
    ports: ["8501:8501"]
    restart: unless-stopped
  api:
    image: rag-ecc
    depends_on: [app]
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
